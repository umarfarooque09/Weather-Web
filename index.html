<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather App</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="background">
        <!-- Weather effects -->
        <div class="rain"></div>
        <div class="lightning"></div>

        <div class="container py-5">
            <div class="search-card text-center p-4">
                <h1 id="heading" class="mb-3">🌤 Weather App</h1>

                <input type="text" id="cityInput" class="form-control my-3" placeholder="Enter city name">

                <button class="btn btn-weather w-100" onclick="getWeather()">
                    Get Weather
                </button>

                <p id="error" class="text-danger mt-3"></p>
            </div>
        </div>

        <!-- Current Weather -->
        <div id="weatherResult" class="weather-card d-none">
            <h2 id="cityName"></h2>
            <img id="weatherIcon">
            <h3 id="temperature"></h3>
            <p id="description"></p>
            <p>💧 <span id="humidity"></span>% | 💨 <span id="wind"></span> m/s</p>
        </div>

        <!-- Forecast -->
        <div id="forecast" class="row justify-content-center"></div>
    </div>
    </div>
    <script src="./app.js"></script>
</body>
</html>
